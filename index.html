      function build(filter) {
        var f = (filter || "").toLowerCase().trim(),
          html = "",
          last = "",
          n = 0;
        items.forEach(function (it) {
          if (f && (it.name + " " + it.sec).toLowerCase().indexOf(f) < 0)
            return;
          if (it.sec !== last) {
            if (last) html += "</tbody>";
            html +=
              '<tbody class="sh"><tr class="sec"><td colspan="7">' +
              it.sec +
              '</td></tr></tbody><tbody class="bd" data-k="' +
              it.sec +
              '"' +
              (IMG[it.sec]
                ? ' style="background-image:linear-gradient(rgba(255,246,138,.5),rgba(255,246,138,.5)),url(' +
                  IMG[it.sec] +
                  ')"'
                : "") +
              ">";
            last = it.sec;
          }
          var q = qty[it.id] || 0;
          n++;
          html +=
            '<tr class="' +
            (q ? "on" : "") +
            '" id="i' +
            it.id +
            '"><td class="c">' +
            it.sno +
            '</td><td class="nm">' +
            it.name +
            (TA[it.id] ? '<div class="ta">' + TA[it.id] + "</div>" : "") +
            '</td><td class="c">' +
            it.unit +
            '</td><td class="r mrp"><span class="xm">' +
            it.mrp.toFixed(2) +
            '</span></td><td class="r off">' +
            it.price.toFixed(2) +
            '</td><td><div class="qc"><button data-d="-1" data-id="' +
            it.id +

            q +
            '" data-id="' +
            it.id +
            '"><button data-d="1" data-id="' +
            it.id +
            '" aria-label="more">+</button></div></td><td class="r" id="l' +
            it.id +
            '">' +
            (q ? (q * it.price).toFixed(2) : "") +
            "</td></tr>";
        });
        list.innerHTML = n
          ? '<table class="pl"><thead><tr><th>S.No</th><th>Product Name</th><th>Pkt</th><th>Actual Price</th><th>80% OFF</th><th>Qty</th><th>Amount</th></tr></thead>' +
            html +
            "</tbody></table>"

        fitBg();

      function fitBg() {
        document.querySelectorAll("tbody.bd").forEach(function (b) {
          var d = IMGD[b.dataset.k];
          if (!d) return;
          var k = Math.min(
            1,
            (b.offsetHeight * 0.92) / d[1],
            (b.offsetWidth * 0.5) / d[0],
          );
          b.style.backgroundSize =
            "100% 100%," +
            Math.round(d[0] * k) +
            "px " +
            Math.round(d[1] * k) +
            "px";
        });
      }
      window.addEventListener("resize", fitBg);
      function setQ(id, v) {

          row = document.getElementById("i" + id);
        if (row) {
          row.classList.toggle("on", !!v);

      }
      function totals() {

              "</td></tr></tfoot></table>"
            : '<div class="empty">Nothing selected yet.</div>') +
          '<div class="fld"><label for="cn">Name *</label><input id="cn" type="text" autocomplete="name" placeholder="Your name"></div><div class="fld"><label for="ph">Phone number *</label><input id="ph" type="tel" inputmode="tel" placeholder="Your phone number"></div><div class="fld"><label for="ad">Delivery Address *</label><textarea id="ad" rows="2" placeholder="Delivery address"></textarea></div><label class="chk" style="display:none"><input type="checkbox" id="os" checked> Only selected items in file</label><div class="how"><b>How to place your order</b><ol><li>Fill in Name, Phone number and Delivery Address (all required).</li><li>Click <b>Download PDF</b> and save the Order PDF.</li><li>Click <b>Send on WhatsApp</b>, then attach the saved Order PDF in the chat (paperclip, then Document).</li><li>Make the payment to <b>+91 98434 56622</b> (GPay / PhonePe).</li><li>Send the payment screenshot in the same WhatsApp chat.</li></ol></div><div class="row"><button class="btn" id="pdf">Download PDF</button><button class="btn alt" id="wa">Send on WhatsApp</button><button class="btn alt" id="cl">Close</button></div><div class="sub" id="dn" style="margin-top:8px"></div>';
        var cn = document.getElementById("cn"),
          ph = document.getElementById("ph"),
          ad = document.getElementById("ad");
        cn.value = cust.n;
        ph.value = cust.p;
        ad.value = cust.a;
        cn.oninput =
          ph.oninput =
          ad.oninput =
            function () {
              cust.n = cn.value.trim();
              cust.p = ph.value.trim();
              cust.a = ad.value.trim();
              try {
                localStorage.setItem(KEY + "c", JSON.stringify(cust));
              } catch (e) {}
            };
        document.getElementById("cl").onclick = function () {
          bill.classList.remove("show");
        };
        document.getElementById("pdf").onclick = exportPDF;
        document.getElementById("wa").onclick = sendWA;
        bill.classList.add("show");
      };
      bill.addEventListener("click", function (e) {
        if (e.target === bill) bill.classList.remove("show");
      });
      var dl = null,
        cust = { n: "", p: "", a: "" };
      try {
        var cc = JSON.parse(localStorage.getItem(KEY + "c") || "null");
        if (cc) cust = { n: cc.n || "", p: cc.p || "", a: cc.a || "" };
      } catch (e) {}
      try {
        if (window.claude && claude.use)
          claude
            .use("downloads")
            .then(function (d) {
              dl = d;
            })
            .catch(function () {});
      } catch (e) {}
      function msg(t) {
        var e = document.getElementById("dn");
        if (e) {
          e.textContent = t;
          e.style.color = "";
          e.style.fontWeight = "";
        }
      }
      function fileRows() {
        var only = document.getElementById("os").checked,
          out = [],
          last = "",
          tot = 0;
        items.forEach(function (it) {
          var q = qty[it.id] || 0;
          if (only && !q) return;
          if (it.sec !== last) {
            out.push({ sec: it.sec });
            last = it.sec;
          }
          var a = q * it.price;
          tot += a;
          out.push({
            c: [
              it.sno,
              it.name,
              it.unit,
              it.mrp.toFixed(2),
              it.price.toFixed(2),
              q || "",
              q ? a.toFixed(2) : "",
            ],
          });
        });
        return {
          rows: out,
          total: Math.round(tot * 100) / 100,
          empty: only && !out.length,
        };
      }
      function saveFile(name, data, ok) {
        if (!dl) {
          try {
            var u = URL.createObjectURL(
                data instanceof Blob ? data : new Blob([data]),
              ),
              l = document.createElement("a");
            l.href = u;
            l.download = name;
            document.body.appendChild(l);
            l.click();
            l.remove();
            setTimeout(function () {
              URL.revokeObjectURL(u);
            }, 4000);
            msg(ok || "Saved.");
          } catch (e) {
            msg("Could not save the file.");
          }
          return;
        }
        dl.save({ filename: name, data: data })
          .then(function () {
            msg(ok || "Saved.");
          })
          .catch(function (e) {
            if (!e || e.code !== "declined") msg("Could not save the file.");
          });
      }
      function makePDF() {
        var f = fileRows();
        if (f.empty) {
          msg("Select some items first.");
          return null;
        }
        if (!window.jspdf) {
          msg("PDF tool did not load.");
          return null;
        }
        var doc = new window.jspdf.jsPDF({ unit: "pt", format: "a4" });
        doc.setFont("helvetica", "bold");
        doc.setFontSize(14);
        doc.text(
          "A.B. CRACKERS - PRICE LIST 2026 (80% OFF) - MY ORDER",
          297.5,
          32,
          { align: "center" },
        );
        var cl = [];
        if (cust.n) cl.push("Name: " + cust.n);
        if (cust.p) cl.push("Phone: " + cust.p);
        if (cust.a)
          cl = cl.concat(
            doc.splitTextToSize("Delivery Address: " + cust.a, 535),
          );
        doc.setFont("helvetica", "normal");
        doc.setFontSize(9);
        cl.forEach(function (t, i) {
          doc.text(t, 28, 46 + i * 11);
        });
        var sy = 44 + (cl.length ? cl.length * 11 + 6 : 0);
        var Y = [255, 246, 128],
          body = f.rows.map(function (r) {
            if (r.sec)
              return [
                {
                  content: r.sec.toUpperCase(),
                  colSpan: 7,
                  styles: {
                    fillColor: [160, 32, 140],
                    textColor: 255,
                    halign: "center",
                    fontStyle: "bold",
                  },
                },
              ];
            var b = r.c[5] !== "";
            return r.c.map(function (v) {
              return {
                content: String(v),
                styles: { fontStyle: b ? "bold" : "normal" },
              };
            });
          });
        body.push([
          {
            content: "GRAND TOTAL (Rs.)",
            colSpan: 6,
            styles: { halign: "right", fontStyle: "bold" },
          },
          {
            content: f.total.toFixed(2),
            styles: { halign: "right", fontStyle: "bold" },
          },
        ]);
        doc.autoTable({
          head: [
            [
              "S.No",
              "Product Name",
              "Pkt",
              "Actual Price",
              "80% OFF",
              "Qty",
              "Amount",
            ],
          ],
          body: body,
          startY: sy,
          theme: "grid",
          margin: { left: 28, right: 28, bottom: 28 },
          styles: {
            fontSize: 8,
            cellPadding: 2.5,
            lineColor: [0, 0, 0],
            lineWidth: 0.5,
            textColor: 0,
            fillColor: Y,
          },
          headStyles: {
            fillColor: Y,
            textColor: 0,
            fontStyle: "bold",
            halign: "center",
          },
          columnStyles: {
            0: { halign: "center", cellWidth: 30 },
            2: { halign: "center", cellWidth: 32 },
            3: { halign: "right", cellWidth: 58 },
            4: { halign: "right", cellWidth: 52 },
            5: { halign: "center", cellWidth: 34 },
            6: { halign: "right", cellWidth: 64 },
          },
          didParseCell: function (d) {
            if (d.section !== "body" || d.row.raw.length !== 7) return;
            if (d.column.index === 3) d.cell.styles.textColor = [0, 0, 0];
            d.cell.styles.fontStyle = "bold";
            if (d.column.index === 4) {
              d.cell.styles.textColor = [179, 0, 27];
              d.cell.styles.fontStyle = "bold";
            }
          },
          didDrawCell: function (d) {
            if (
              d.section !== "body" ||
              d.row.raw.length !== 7 ||
              d.column.index !== 3
            )
              return;
            var c = d.cell;
            doc.setFont("helvetica", c.styles.fontStyle);
            doc.setFontSize(c.styles.fontSize);
            var w = doc.getTextWidth(c.text.join("")),
              x2 = c.x + c.width - c.padding("right"),
              y = c.y + c.height / 2;
            var h = c.styles.fontSize * 0.4;
            doc.setDrawColor(210, 0, 0);
            doc.setLineWidth(0.8);
            doc.line(x2 - w - 1, y - h, x2 + 1, y + h);
            doc.line(x2 - w - 1, y + h, x2 + 1, y - h);
          },
        });
        return doc.output("blob");
      }
      function errMsg(t) {
        var e = document.getElementById("dn");
        if (e) {
          e.textContent = t;
          e.style.color = "#b00020";
          e.style.fontWeight = "700";
        }
      }
      function validate() {
        var cn = document.getElementById("cn"),
          ph = document.getElementById("ph"),
          ad = document.getElementById("ad"),
          bad = null,
          e = "";
        [cn, ph, ad].forEach(function (x) {
          x.style.borderColor = "";
        });
        var n = cn.value.trim().replace(/\s+/g, " "),
          d = ph.value.replace(/\D/g, ""),
          a = ad.value.trim();
        if (d.length === 12 && d.indexOf("91") === 0) d = d.slice(2);
        else if (d.length === 11 && d.charAt(0) === "0") d = d.slice(1);
        if (
          !/^[A-Za-z\u0B80-\u0BFF][A-Za-z\u0B80-\u0BFF .'\-]{1,59}$/.test(n)
        ) {
          bad = cn;
          e = "Please enter your name (letters only, at least 2 characters).";
        } else if (!/^[6-9]\d{9}$/.test(d)) {
          bad = ph;
          e = "Please enter a valid 10-digit Indian mobile number.";
        } else if (a.length < 10 || !/[A-Za-z\u0B80-\u0BFF]/.test(a)) {
          bad = ad;
          e =
            "Please enter your full delivery address (at least 10 characters).";
        }
        if (bad) {
          bad.style.borderColor = "#b00020";
          bad.focus();
          errMsg(e);
          return false;
        }
        cn.value = cust.n = n;
        ph.value = cust.p = "+91 " + d.slice(0, 5) + " " + d.slice(5);
        ad.value = cust.a = a;
        try {
          localStorage.setItem(KEY + "c", JSON.stringify(cust));
        } catch (x) {}
        return true;
      }
      function exportPDF() {
        if (!Object.keys(qty).length) {
          msg("Select some items first.");
          return;
        }
        if (!validate()) return;
        var b = makePDF();
        if (b) saveFile("AB-Crackers-order-2026.pdf", b);
      }
      var LOG_URL = "https://script.google.com/macros/s/AKfycbxdhXi0d51isFJZOdT3u6V6hS6EtuqmXacQcSqDaVHMRBQViij30EXU2ZKAju0S-P11WA/exec",
        WA_NUM = "919843456622";
      function logOrder() {
        if (!LOG_URL) return;
        var it = [],
          t = 0;
        for (var k in qty) {
          var m = items[k],
            a = qty[k] * m.price;
          t += a;
          it.push({
            sno: m.sno,
            name: m.name,
            unit: m.unit,
            qty: qty[k],
            rate: m.price,
            amount: a,
          });
        }
        try {
          fetch(LOG_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              time: new Date().toISOString(),
              name: cust.n,
              phone: cust.p,
              address: cust.a,
              items: it,
              total: Math.round(t * 100) / 100,
              page: location.href,
            }),
            keepalive: true,
          }).catch(function () {});
        } catch (e) {}
      }
      function sendWA() {
        if (!Object.keys(qty).length) {
          msg("Select some items first.");
          return;
        }
        if (!validate()) return;
        logOrder();
        var l = document.createElement("a");
        l.href =
          "https://wa.me/" + WA_NUM + "?text=" + encodeURIComponent(billText());
        l.target = "_blank";
        l.rel = "noopener";
        document.body.appendChild(l);
        l.click();
        l.remove();
        msg(
          "WhatsApp opened. Attach the saved Order PDF there (paperclip, then Document).",
        );
      }
      function sendWAold() {
        var b = makePDF();
        if (!b) return;
        var name = "AB-Crackers-order-2026.pdf",
          txt = billText(),
          file = null;
        try {
          file = new File([b], name, { type: "application/pdf" });
        } catch (e) {}
        if (
          file &&
          navigator.canShare &&
          navigator.canShare({ files: [file] })
        ) {
          navigator.share({ files: [file], text: txt }).catch(function (e) {
            if (e && e.name !== "AbortError") waFallback(b, name, txt);
          });
          return;
        }
        waFallback(b, name, txt);
      }
      function waFallback(b, name, txt) {
        var copied = "";
        try {
          navigator.clipboard.writeText(txt);
          copied = " Order text copied.";
        } catch (e) {}
        saveFile(
          name,
          b,
          "PDF ready." +
            copied +
            " In WhatsApp, attach the PDF and paste the text.",
        );
      }
      build();
      totals();
    </script>
  </body>
